<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Tareq Orabi, a software engineer and founder of Octagram, building backend-driven SaaS products, dashboards, and production systems." />
    <meta name="keywords" content="Tareq Orabi, Octagram, Software Engineer, Backend Developer, SaaS, Founder, Jordan, Spring Boot, .NET, Docker" />
    <link rel="canonical" href="https://tareqorabi.com/" />
    <meta name="theme-color" content="#030305" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tareqorabi.com/" />
    <meta property="og:title" content="Tareq Orabi — Software Engineer & Founder of Octagram" />
    <meta property="og:description" content="I build backend-driven SaaS products, dashboards, and production systems for real businesses — from database design to deployment." />
    <meta property="og:image" content="https://tareqorabi.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tareqorabi.com/" />
    <meta name="twitter:title" content="Tareq Orabi — Software Engineer & Founder of Octagram" />
    <meta name="twitter:description" content="I build backend-driven SaaS products, dashboards, and production systems for real businesses — from database design to deployment." />
    <meta name="twitter:image" content="https://tareqorabi.com/og-image.jpg" />

    <title>Tareq Orabi — Software Engineer & Founder of Octagram</title>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tareq Orabi",
        "jobTitle": "Software Engineer & Founder",
        "url": "https://tareqorabi.com/",
        "sameAs": [
          "https://github.com/Tareq-Orabi",
          "https://linkedin.com/in/tareq-orabi"
        ],
        "worksFor": {
          "@type": "Organization",
          "name": "Octagram",
          "url": "https://www.instagram.com/octagram.jo/"
        },
        "description": "Software engineer and founder of Octagram, specializing in backend architecture, Spring Boot, .NET Core, Docker, Nginx, and production database systems."
      }
    </script>
    <!-- Font preconnect: eliminates DNS+TLS round-trip delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      font-display: swap — text renders immediately in fallback font.
      Space Grotesk swaps in when loaded. This ensures h1.hero-name
      is VISIBLE on first paint (critical for LCP < 2s).
      We only load the weights we actually use: 500 (hero h1) and 600/700.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
